<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TEKAI NRP — Wiki officiel</title><style>
:root{color-scheme:dark;--bg:#0c1018;--panel:#121a26;--panel2:#172232;--line:#283548;--txt:#e8edf5;--muted:#a5b2c4;--red:#e65b57;--blue:#52a7e6;--gold:#f0c77a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 system-ui,-apple-system,Segoe UI,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:#101722;border-right:1px solid var(--line);padding:25px 17px}.brand{display:flex;align-items:center;gap:12px;margin:0 7px 28px}.brandmark{height:45px;width:45px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#e25d54,#7c283c);font-size:26px}.brand strong{display:block;letter-spacing:2px;font-size:19px}.brand small{color:var(--muted);font-size:11px;letter-spacing:1.5px}.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:#0b111b;color:var(--txt);outline:none}.group{margin-top:25px}.group-label{color:#8192aa;text-transform:uppercase;letter-spacing:1.6px;font-weight:750;font-size:11px;margin:0 12px 9px}.nav{display:block;width:100%;text-align:left;border:0;background:none;color:#aab8c9;border-radius:8px;padding:9px 12px;cursor:pointer}.nav:hover{background:#1a2738;color:white}.nav.active{background:#283448;color:white;font-weight:700;border-left:3px solid var(--red)}.main{min-width:0}.top{height:68px;display:flex;justify-content:space-between;align-items:center;padding:0 7%;border-bottom:1px solid var(--line);color:var(--muted)}.top span{font-size:12px;letter-spacing:2px}.tag{border:1px solid #42536b;padding:4px 11px;border-radius:99px;font-size:12px}.content{max-width:1000px;margin:0 auto;padding:65px 7% 100px}.eyebrow{color:var(--gold);font-size:12px;text-transform:uppercase;letter-spacing:2px;font-weight:800}h1{font-size:clamp(34px,5vw,58px);line-height:1.12;letter-spacing:-1.6px;margin:14px 0 20px}h2{font-size:25px;margin:36px 0 13px}h3{font-size:18px;margin:24px 0 8px}p,li{color:#b6c3d3}ul{padding-left:22px}li{margin:7px 0}.lead{font-size:18px;color:#c7d2df;max-width:730px}.hero{padding:35px;border:1px solid #384257;border-radius:18px;background:radial-gradient(circle at 90% 10%,#6b28384d,transparent 45%),linear-gradient(135deg,#1c2638,#101824)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:26px}.card{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:20px;text-align:left;cursor:pointer;color:var(--txt)}.card:hover{border-color:#6d7e98;background:#1a2635}.card b{display:block;font-size:17px;margin:9px 0}.card p{margin:0;font-size:13px}.symbol{font-size:27px}.note{padding:17px 20px;background:#1b2635;border-left:3px solid var(--gold);border-radius:6px;margin:24px 0;color:#d5dce5}.danger{border-left-color:var(--red)}.blue{color:var(--blue)}.red{color:var(--red)}.rule{padding:16px 20px;margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.rule h3{margin:0 0 6px}.rule p{margin:0}.breadcrumb{color:#8294a8;font-size:13px;margin-bottom:20px}.footer{border-top:1px solid var(--line);margin-top:50px;padding-top:25px;color:#78899e;font-size:12px}.menu-toggle{display:none}.hidden{display:none!important}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{position:fixed;z-index:10;left:-290px;width:280px;transition:left .2s;box-shadow:15px 0 40px #0008}.sidebar.open{left:0}.menu-toggle{display:inline-block;background:none;border:1px solid var(--line);color:white;padding:7px 12px;border-radius:8px}.top{padding:0 22px}.content{padding:35px 22px 70px}.hero{padding:24px}}
</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">忍</div><div><strong>TEKAI</strong><small>NARUTO ROLEPLAY</small></div></div><input id="search" class="search" placeholder="⌕ Rechercher une page..." aria-label="Rechercher une page"><nav id="nav"></nav></aside><main class="main"><div class="top"><button class="menu-toggle" id="menu">☰ Menu</button><span>TEKAI / WIKI OFFICIEL</span><span class="tag">NRP</span></div><article class="content" id="content"></article></main></div><script>
const pages={
'accueil':{group:'Découvrir',name:'Bienvenue sur TEKAI',icon:'⛩️',intro:'Le guide officiel de votre aventure Naruto Roleplay.',body:`<div class="hero"><div class="eyebrow">Bienvenue dans l'univers shinobi</div><h1>TEKAI <span class="red">NARUTO RP</span></h1><p class="lead">Deux villages. Des clans légendaires. Des alliances fragiles. Écris ton histoire de ninja dans le monde de TEKAI.</p></div><h2>Explorer le wiki</h2><div class="cards"><button class="card" data-go="reglement"><span class="symbol">📜</span><b>Règlement</b><p>Les règles essentielles pour un RP juste et immersif.</p></button><button class="card" data-go="konoha"><span class="symbol">🍃</span><b>Konoha</b><p>Le Village Caché de la Feuille et ses clans.</p></button><button class="card" data-go="kiri"><span class="symbol">🌊</span><b>Kiri</b><p>Le Village Caché de la Brume et ses clans.</p></button><button class="card" data-go="grades"><span class="symbol">🥷</span><b>Progression ninja</b><p>Grades, missions, examens et évolution.</p></button></div><div class="note danger"><strong>Important :</strong> Les informations lues sur le wiki sont hors RP (HRP). Ton personnage ne les connaît pas automatiquement : il doit les découvrir en jeu.</div><h2>Avant de commencer</h2><p>Lis le règlement, choisis ton village, découvre les clans accessibles et construis un personnage cohérent. Les capacités rares, les promotions et les événements majeurs sont soumis à la validation du staff.</p>`},
'reglement':{group:'Règlement',name:'Règlement général',icon:'📜',intro:'Les règles communes à tous les joueurs de TEKAI.',body:`<div class="rule"><h3>1. Respect et comportement</h3><p>Le respect est obligatoire envers les joueurs et le staff. Harcèlement, insultes HRP, discrimination, menaces et triche sont interdits. Les conflits RP ne doivent jamais devenir des conflits personnels.</p></div><div class="rule"><h3>2. Roleplay sérieux</h3><p>Reste cohérent avec ton personnage, son histoire, son grade et ses connaissances. Le troll, le spam vocal et les actions irréalistes sont interdits.</p></div><div class="rule"><h3>3. Metagaming</h3><p>Interdiction d'utiliser en RP des informations apprises hors RP (Discord, stream, wiki, discussion privée), sauf si ton personnage les a découvertes légitimement.</p></div><div class="rule"><h3>4. Powergaming</h3><p>Interdiction de forcer une action impossible ou d'imposer sa réussite à un autre joueur sans possibilité de réponse RP. Respecte les limites de tes capacités.</p></div><div class="rule"><h3>5. FearRP</h3><p>Ton personnage doit craindre le danger et agir en conséquence. Une menace crédible, un adversaire nettement supérieur ou une situation désespérée doivent influencer ses choix.</p></div><div class="rule"><h3>6. PainRP</h3><p>Joue les blessures, la fatigue et les conséquences des combats. Un personnage blessé ne peut pas agir comme s'il était indemne.</p></div><div class="rule"><h3>7. FreeKill et agressions</h3><p>Toute attaque doit avoir une justification RP valable. Le meurtre gratuit, l'agression sans contexte et l'enchaînement de combats sans motif sont interdits.</p></div><div class="rule"><h3>8. No Revenge Kill</h3><p>Après une mort RP ou une mise hors combat avec perte de mémoire validée, tu ne peux pas revenir immédiatement te venger en utilisant les informations de l'affrontement.</p></div><div class="rule"><h3>9. Déconnexion et abus</h3><p>Il est interdit de se déconnecter pour éviter un combat, une capture, une sanction ou une conséquence RP. Les bugs et exploits doivent être signalés au staff.</p></div><div class="rule"><h3>10. Staff et sanctions</h3><p>Le staff peut appliquer un avertissement, une exclusion temporaire ou un bannissement selon la gravité et la récidive. Les contestations se font calmement via le canal de support officiel.</p></div><div class="note">Ce règlement est une base proposée pour TEKAI. Le staff peut préciser les exceptions, les barèmes et les procédures avant l'ouverture du serveur.</div>`},
'combat':{group:'Règlement',name:'Combats & blessures',icon:'⚔️',intro:'Les combats doivent raconter une histoire, pas seulement désigner un vainqueur.',body:`<h2>Engager un combat</h2><ul><li>Une raison RP identifiable est nécessaire pour lancer une agression.</li><li>Les provocations HRP ne constituent jamais un motif RP.</li><li>Les attaques surprises doivent rester cohérentes avec la situation et les mécaniques du serveur.</li></ul><h2>Techniques et chakra</h2><ul><li>Utilise uniquement les techniques apprises et autorisées pour ton personnage.</li><li>Respecte les coûts de chakra, les temps de récupération et les limitations du système.</li><li>Il est interdit de déclarer une technique imparable ou de nier automatiquement les réactions adverses.</li></ul><h2>Blessures, capture et mort RP</h2><p>Une blessure grave entraîne des conséquences jouées en RP. Les captures, mutilations permanentes, pertes de pouvoir et morts RP définitives nécessitent une justification solide et, lorsqu'elles affectent durablement un personnage, une validation du staff.</p><div class="note danger">La mort RP définitive n'est jamais une décision arbitraire prise par un joueur seul.</div>`},
'village':{group:'Règlement',name:'Règles des villages',icon:'🏯',intro:'La politique et les conflits entre villages se construisent en RP.',body:`<h2>Appartenance</h2><p>Chaque personnage débute avec un village d'origine défini dans sa fiche. Changer de village, devenir déserteur ou infiltrer un autre village nécessite un déroulement RP crédible.</p><h2>Espionnage et diplomatie</h2><p>Les informations confidentielles doivent être obtenues en RP. Les accords, déclarations de guerre, opérations secrètes et prises de pouvoir majeures sont encadrés par le staff pour préserver l'équilibre.</p><h2>Désertion</h2><p>Une désertion a des conséquences : perte de confiance, traque éventuelle et modification des relations diplomatiques. Les connaissances et techniques secrètes ne deviennent pas librement transmissibles.</p>`},
'konoha':{group:'Village de Konoha',name:'Konoha — Village de la Feuille',icon:'🍃',intro:'Le village de la volonté du Feu.',body:`<div class="hero"><div class="eyebrow red">Pays du Feu</div><h1>🍃 KONOHA</h1><p class="lead">Un village fondé sur la solidarité, la transmission et la protection de ses habitants.</p></div><h2>Organisation</h2><p>Le Hokage dirige le village et supervise les forces shinobi. Les ninjas progressent de Genin à Chûnin puis Jônin selon leur mérite, leurs missions et les examens.</p><h2>Clans jouables</h2><div class="cards"><button class="card" data-go="uchiha"><b>🔥 Uchiha</b><p>Sharingan, perception et Katon.</p></button><button class="card" data-go="hyuga"><b>👁️ Hyûga</b><p>Byakugan et Jûken.</p></button><button class="card" data-go="senju"><b>🌳 Senju</b><p>Polyvalence et vitalité.</p></button></div><h2>Valeurs RP</h2><p>La loyauté, l'entraide et le devoir de protection sont au cœur de Konoha. Les rivalités entre clans sont possibles, mais doivent rester cohérentes avec le lore établi par le serveur.</p>`},
'uchiha':{group:'Village de Konoha',name:'Clan Uchiha',icon:'🔥',intro:'Le clan du Sharingan et de l'héritage du feu.',body:`<h2>Présentation</h2><p>Les Uchiha sont réputés pour leurs capacités visuelles, leur maîtrise du combat et leur affinité traditionnelle avec le Katon. Leur histoire peut nourrir des intrigues de fierté, de rivalité et de loyauté.</p><h2>Capacités proposées</h2><ul><li><strong>Sharingan :</strong> perception accrue et lecture des mouvements, selon les paliers débloqués.</li><li><strong>Katon :</strong> techniques de feu accessibles après apprentissage.</li><li><strong>Genjutsu :</strong> potentiel d'illusions sous conditions de progression.</li></ul><h2>Limites et progression</h2><p>Le Sharingan n'est pas maîtrisé intégralement dès la création du personnage. Les évolutions exceptionnelles, dont le Mangekyô Sharingan, nécessitent des conditions RP et une validation explicite du staff. Aucune technique n'est automatiquement copiée sans les prérequis du serveur.</p>`},
'hyuga':{group:'Village de Konoha',name:'Clan Hyûga',icon:'👁️',intro:'Le Byakugan et la précision du poing souple.',body:`<h2>Présentation</h2><p>Le clan Hyûga est connu pour sa discipline, son dôjutsu héréditaire et son style de taijutsu centré sur le réseau de chakra.</p><h2>Capacités proposées</h2><ul><li><strong>Byakugan :</strong> champ de vision élargi et perception du chakra, dans les limites du gameplay.</li><li><strong>Jûken :</strong> frappes précises visant à perturber la circulation du chakra.</li><li><strong>Techniques défensives :</strong> rotation et protection rapprochée après entraînement.</li></ul><h2>Limites</h2><p>Le Byakugan ne révèle pas toutes les informations d'un personnage. Les techniques avancées, dont les Soixante-Quatre Poings, demandent un apprentissage RP.</p>`},
'senju':{group:'Village de Konoha',name:'Clan Senju',icon:'🌳',intro:'L'endurance, la volonté et la polyvalence shinobi.',body:`<h2>Présentation</h2><p>Les Senju sont associés à une grande capacité d'adaptation, une forte vitalité et un héritage de leadership au sein de Konoha.</p><h2>Capacités proposées</h2><ul><li><strong>Vitalité :</strong> endurance supérieure selon l'équilibrage serveur.</li><li><strong>Polyvalence :</strong> possibilités variées en ninjutsu, taijutsu et soutien.</li><li><strong>Coopération :</strong> rôles de protection et de commandement.</li></ul><div class="note danger"><strong>Attention :</strong> le Mokuton n'est pas un pouvoir automatique de tous les Senju. Il est considéré comme exceptionnel et doit être autorisé séparément par le staff.</div>`},
'kiri':{group:'Village de Kiri',name:'Kiri — Village de la Brume',icon:'🌊',intro:'Le village des eaux, de la brume et des secrets.',body:`<div class="hero"><div class="eyebrow blue">Pays de l'Eau</div><h1>🌊 KIRI</h1><p class="lead">Un village façonné par les traditions martiales, la maîtrise de l'eau et les intrigues de la brume.</p></div><h2>Organisation</h2><p>Le Mizukage dirige Kiri. Les shinobi du village sont formés à la discipline, à la discrétion et à la coopération dans des environnements difficiles.</p><h2>Clans jouables</h2><div class="cards"><button class="card" data-go="karatachi"><b>🐉 Karatachi</b><p>Héritage politique et traditions de Kiri.</p></button><button class="card" data-go="hozuki"><b>💧 Hôzuki</b><p>Hydrification et techniques aqueuses.</p></button><button class="card" data-go="fuma"><b>🌀 Fûma</b><p>Armes de jet et techniques de précision.</p></button></div><h2>Valeurs RP</h2><p>Le contrôle, la loyauté et la survie façonnent la culture de Kiri. Son passé peut être exploré en RP sans imposer automatiquement une période précise de l'histoire canonique.</p>`},
'karatachi':{group:'Village de Kiri',name:'Clan Karatachi',icon:'🐉',intro:'Un héritage lié à l'histoire du pouvoir à Kiri.',body:`<h2>Présentation</h2><p>Le nom Karatachi est associé à Yagura Karatachi, figure importante de Kiri dans l'univers Naruto. Sur TEKAI, le clan est proposé comme une lignée jouable dont le rôle politique et les traditions seront définis par le lore du serveur.</p><h2>Spécialités RP proposées</h2><ul><li>Formation rigoureuse au ninjutsu et à la tactique.</li><li>Affinité possible avec le Suiton après apprentissage.</li><li>Intrigues autour de l'autorité, de l'héritage et du Mizukage.</li></ul><div class="note danger">L'appartenance au clan ne donne pas accès à Isobu, au statut de Jinchûriki ou aux capacités uniques de Yagura.</div>`},
'hozuki':{group:'Village de Kiri',name:'Clan Hôzuki',icon:'💧',intro:'Les maîtres de l'hydrification.',body:`<h2>Présentation</h2><p>Le clan Hôzuki est célèbre pour sa capacité à liquéfier son corps et pour sa proximité avec les techniques d'eau.</p><h2>Capacités proposées</h2><ul><li><strong>Hydrification :</strong> transformation partielle ou temporaire du corps en eau selon les paliers.</li><li><strong>Suiton :</strong> maîtrise progressive des techniques aqueuses.</li><li><strong>Mobilité :</strong> tactiques de fuite et d'esquive adaptées à l'environnement.</li></ul><h2>Limites</h2><p>L'hydrification n'offre pas d'invulnérabilité permanente. Sa durée, ses faiblesses, les coûts de chakra et les contres doivent être définis par l'équilibrage du serveur.</p>`},
'fuma':{group:'Village de Kiri',name:'Clan Fûma',icon:'🌀',intro:'Une branche TEKAI spécialisée dans les armes et l'agilité.',body:`<h2>Présentation</h2><p>Le nom Fûma apparaît dans plusieurs lignées et groupes de l'univers Naruto. Pour TEKAI, cette branche installée à Kiri est une adaptation originale du serveur.</p><h2>Capacités proposées</h2><ul><li><strong>Shurikenjutsu :</strong> maîtrise des grands shuriken et des armes de jet.</li><li><strong>Agilité :</strong> déplacements rapides et positionnement tactique.</li><li><strong>Pièges :</strong> préparation du terrain et embuscades cohérentes en RP.</li></ul><h2>Limites</h2><p>Les armes spéciales, les techniques secrètes et les capacités rares doivent être obtenues en jeu. Le clan n'a pas accès à tous les pouvoirs associés aux différentes versions des Fûma.</p>`},
'grades':{group:'Progression RP',name:'Grades shinobi',icon:'🥷',intro:'Construis ton parcours ninja étape par étape.',body:`<div class="rule"><h3>Étudiant à l'académie</h3><p>Découverte du village, du chakra, des bases du combat et des règles RP.</p></div><div class="rule"><h3>Genin</h3><p>Premières missions, entraînements encadrés et travail en équipe.</p></div><div class="rule"><h3>Chûnin</h3><p>Responsabilités plus importantes, missions difficiles et capacité à diriger une équipe.</p></div><div class="rule"><h3>Jônin</h3><p>Ninja expérimenté pouvant encadrer les jeunes shinobi et participer aux missions majeures.</p></div><div class="rule"><h3>ANBU / unités spéciales</h3><p>Postes soumis à sélection et validation RP du village et du staff.</p></div><div class="rule"><h3>Hokage / Mizukage</h3><p>Rôles de direction exceptionnels, attribués selon l'organisation du serveur.</p></div><div class="note">Les promotions ne sont pas automatiques : elles dépendent de l'activité RP, des compétences et des validations prévues par le staff.</div>`},
'missions':{group:'Progression RP',name:'Missions & examens',icon:'📋',intro:'La progression passe par des aventures vécues en jeu.',body:`<h2>Rangs de missions</h2><ul><li><strong>D :</strong> services locaux et entraînement.</li><li><strong>C :</strong> escortes et missions de terrain avec risques limités.</li><li><strong>B :</strong> opérations dangereuses et menaces shinobi.</li><li><strong>A :</strong> missions à haut risque et enjeux stratégiques.</li><li><strong>S :</strong> opérations exceptionnelles, réservées aux ninjas autorisés.</li></ul><h2>Examens</h2><p>Les examens Genin et Chûnin peuvent inclure épreuves écrites, tactiques, entraînements et affrontements RP. Le résultat dépend du comportement, de la cohérence et de la réussite des objectifs, pas uniquement des victoires.</p>`},
'chakra':{group:'Progression RP',name:'Chakra & techniques',icon:'✨',intro:'Une puissance qui se travaille et se maîtrise.',body:`<h2>Affinités élémentaires</h2><p>Les cinq natures classiques de chakra sont Katon (feu), Suiton (eau), Fûton (vent), Doton (terre) et Raiton (foudre). Le choix des affinités dépend de la progression et des règles de TEKAI.</p><h2>Apprentissage</h2><p>Les techniques sont acquises par entraînement, enseignement et validation lorsque nécessaire. Un personnage ne peut pas utiliser librement toutes les techniques de son clan ou de son village dès sa création.</p><h2>Techniques rares</h2><p>Les dôjutsu avancés, kekkei genkai rares, invocations exceptionnelles, bijû et capacités légendaires sont strictement encadrés par le staff.</p>`}
};
const groups=['Découvrir','Règlement','Village de Konoha','Village de Kiri','Progression RP'];const nav=document.getElementById('nav'),content=document.getElementById('content');function buildNav(q=''){nav.innerHTML='';for(const g of groups){const matches=Object.entries(pages).filter(([id,p])=>p.group===g&&(p.name+' '+p.intro).toLowerCase().includes(q.toLowerCase()));if(!matches.length)continue;const section=document.createElement('div');section.className='group';section.innerHTML=`<div class="group-label">${g}</div>`;for(const [id,p] of matches){const b=document.createElement('button');b.className='nav';b.dataset.go=id;b.textContent=p.icon+'  '+p.name;section.append(b)}nav.append(section)}}function show(id){if(!pages[id])id='accueil';const p=pages[id];content.innerHTML=`<div class="breadcrumb">Wiki TEKAI / ${p.group}</div>${id==='accueil'?'':`<div class="eyebrow">${p.icon} ${p.group}</div><h1>${p.name}</h1><p class="lead">${p.intro}</p>`}${p.body}<div class="footer">© TEKAI NRP — Wiki communautaire. Version de préparation, à valider par le staff.</div>`;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.go===id));location.hash=id;window.scrollTo({top:0,behavior:'instant'});document.getElementById('sidebar').classList.remove('open')}document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t)show(t.dataset.go)});document.getElementById('search').addEventListener('input',e=>buildNav(e.target.value));document.getElementById('menu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));window.addEventListener('hashchange',()=>show(location.hash.slice(1)));buildNav();show(location.hash.slice(1)||'accueil');
</script></body></html>
